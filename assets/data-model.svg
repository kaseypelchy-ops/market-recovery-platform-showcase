<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
<title id="title">Market Recovery public data model</title>
<desc id="desc">A clean public data model showing normalized source data, identity mapping, derived analytics, and operational recovery objects.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091726"/><stop offset="1" stop-color="#07121f"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3a536b"/></marker>
  <style>
    .col{fill:#61e3c8;font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:2.2px}
    .card{fill:#102338;stroke:#2a445d;stroke-width:1.4}
    .card2{fill:#0d1e31;stroke:#2a445d;stroke-width:1.4}
    .accent{fill:#0a2830;stroke:#356c68;stroke-width:1.4}
    .title{fill:#f3f7fb;font:700 15px Inter,Segoe UI,sans-serif}
    .code{fill:#94abc0;font:10.5px ui-monospace,SFMono-Regular,Consolas,monospace}
    .sub{fill:#7d94aa;font:10.5px Inter,Segoe UI,sans-serif}
    .flow{fill:none;stroke:#3a536b;stroke-width:2;marker-end:url(#arrow)}
    .note{fill:#60788f;font:11px Inter,Segoe UI,sans-serif}
  </style>
</defs>
<rect width="1400" height="760" rx="24" fill="url(#bg)"/>

<text x="68" y="64" class="col">NORMALIZED DATA</text>
<text x="388" y="64" class="col">IDENTITY + MAPPING</text>
<text x="728" y="64" class="col">DERIVED ANALYTICS</text>
<text x="1068" y="64" class="col">OPERATIONS</text>

<!-- normalized data -->
<rect x="68" y="105" width="252" height="90" rx="15" class="card"/>
<text x="92" y="138" class="title">Sales events</text><text x="92" y="165" class="code">sales_events</text>

<rect x="68" y="220" width="252" height="90" rx="15" class="card"/>
<text x="92" y="253" class="title">Disconnect events</text><text x="92" y="280" class="code">disconnect_events</text>

<rect x="68" y="335" width="252" height="104" rx="15" class="card"/>
<text x="92" y="368" class="title">Franchise snapshots</text>
<text x="92" y="394" class="code">franchise_subscriber_</text><text x="92" y="411" class="code">snapshots</text>

<rect x="68" y="464" width="252" height="104" rx="15" class="card"/>
<text x="92" y="497" class="title">INTERNET snapshots</text>
<text x="92" y="523" class="code">internet_market_subscriber_</text><text x="92" y="540" class="code">snapshots</text>

<!-- identity -->
<rect x="388" y="105" width="252" height="90" rx="15" class="card"/>
<text x="412" y="138" class="title">Franchises</text><text x="412" y="165" class="code">franchises</text>

<rect x="388" y="220" width="252" height="90" rx="15" class="card"/>
<text x="412" y="253" class="title">Source markets</text><text x="412" y="280" class="code">internet_source_markets</text>

<rect x="388" y="335" width="252" height="90" rx="15" class="card"/>
<text x="412" y="368" class="title">Canonical markets</text><text x="412" y="395" class="code">markets</text>

<rect x="388" y="450" width="252" height="90" rx="15" class="card"/>
<text x="412" y="483" class="title">Mapping resolutions</text><text x="412" y="510" class="code">mapping_resolutions</text>

<!-- analytics -->
<rect x="728" y="105" width="260" height="90" rx="15" class="card2"/>
<text x="752" y="138" class="title">Activity metrics</text><text x="752" y="165" class="code">franchise_activity_metrics</text>

<rect x="728" y="220" width="260" height="90" rx="15" class="card2"/>
<text x="752" y="253" class="title">Trend signals</text><text x="752" y="280" class="code">internet_market_trend_signals</text>

<rect x="728" y="335" width="260" height="90" rx="15" class="card2"/>
<text x="752" y="368" class="title">Canonical metrics</text><text x="752" y="395" class="code">canonical_market_metrics</text>

<rect x="728" y="450" width="260" height="90" rx="15" class="card2"/>
<text x="752" y="483" class="title">Health signals</text><text x="752" y="510" class="code">canonical_market_health_signals</text>

<rect x="728" y="575" width="260" height="92" rx="15" class="accent"/>
<text x="752" y="608" fill="#61e3c8" font="700 15px Inter,Segoe UI,sans-serif">Recovery scores</text>
<text x="752" y="635" class="code">canonical_market_recovery_scores</text>

<!-- operations -->
<rect x="1068" y="144" width="264" height="100" rx="16" class="card"/>
<text x="1092" y="180" class="title">Recommendation logic</text>
<text x="1092" y="207" class="sub">Eligibility + ranking</text>

<rect x="1068" y="315" width="264" height="100" rx="16" class="card"/>
<text x="1092" y="351" class="title">Recovery projects</text>
<text x="1092" y="378" class="code">market_recovery_projects</text>

<rect x="1068" y="486" width="264" height="100" rx="16" class="card"/>
<text x="1092" y="522" class="title">Project snapshots</text>
<text x="1092" y="549" class="code">project_snapshots</text>

<!-- flow lines -->
<path d="M320 150 H388" class="flow"/><path d="M320 265 H388" class="flow"/><path d="M320 387 H388" class="flow"/><path d="M320 516 H388" class="flow"/>
<path d="M640 150 H728" class="flow"/><path d="M640 265 H728" class="flow"/><path d="M640 380 H728" class="flow"/><path d="M640 495 H728" class="flow"/>
<path d="M858 540 V575" class="flow"/>
<path d="M988 621 H1030 V194 H1068" class="flow"/>
<path d="M1200 244 V315" class="flow"/><path d="M1200 415 V486" class="flow"/>

<text x="68" y="718" class="note">Public view omits production-only keys, identifiers, and business-specific scoring thresholds.</text>
</svg>
