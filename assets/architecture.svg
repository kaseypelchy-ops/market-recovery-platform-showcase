<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Market Recovery Intelligence architecture</title>
<desc id="desc">A clean architecture diagram from source reports through normalization, canonical modeling, analytics, recommendation, investigation, recovery projects, and measured outcomes.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#091726"/><stop offset="1" stop-color="#07121f"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#61e3c8"/><stop offset="1" stop-color="#74a7ff"/></linearGradient>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#3a536b"/></marker>
  <style>
    .col{fill:#61e3c8;font:700 13px Inter,Segoe UI,sans-serif;letter-spacing:2.2px}
    .card{fill:#102338;stroke:#2a445d;stroke-width:1.4}
    .card2{fill:#0d1e31;stroke:#2a445d;stroke-width:1.4}
    .title{fill:#f3f7fb;font:700 16px Inter,Segoe UI,sans-serif}
    .sub{fill:#8298ad;font:11.5px Inter,Segoe UI,sans-serif}
    .mono{fill:#9cb0c3;font:11.5px ui-monospace,SFMono-Regular,Consolas,monospace}
    .flow{fill:none;stroke:#3a536b;stroke-width:2;marker-end:url(#arrow)}
    .note{fill:#60788f;font:11px Inter,Segoe UI,sans-serif}
  </style>
</defs>
<rect width="1400" height="650" rx="24" fill="url(#bg)"/>

<!-- headings -->
<text x="78" y="66" class="col">SOURCE REPORTS</text>
<text x="355" y="66" class="col">NORMALIZE</text>
<text x="650" y="66" class="col">CANONICAL MODEL</text>
<text x="982" y="66" class="col">DECISION + ACTION</text>

<!-- source cards -->
<rect x="68" y="118" width="205" height="82" rx="15" class="card"/>
<text x="92" y="151" class="title">Sales CSV</text>
<text x="92" y="176" class="sub">Acquisition events</text>

<rect x="68" y="230" width="205" height="82" rx="15" class="card"/>
<text x="92" y="263" class="title">Disconnect CSV</text>
<text x="92" y="288" class="sub">Churn evidence</text>

<rect x="68" y="342" width="205" height="82" rx="15" class="card"/>
<text x="92" y="375" class="title">Weekly Report</text>
<text x="92" y="400" class="sub">Subscriber history</text>

<!-- normalize -->
<rect x="335" y="138" width="245" height="266" rx="18" class="card2"/>
<text x="362" y="175" class="title">Validate + parse</text>
<text x="362" y="203" class="sub">Schema signatures</text>
<text x="362" y="224" class="sub">Field normalization</text>
<text x="362" y="245" class="sub">Stable deduplication keys</text>
<line x1="362" y1="270" x2="552" y2="270" stroke="#243d55"/>
<text x="362" y="301" class="mono">sales_events</text>
<text x="362" y="324" class="mono">disconnect_events</text>
<text x="362" y="347" class="mono">subscriber snapshots</text>
<text x="362" y="370" class="mono">market snapshots</text>

<!-- canonical model -->
<rect x="630" y="112" width="278" height="132" rx="18" class="card"/>
<text x="657" y="150" class="title">Canonical market identity</text>
<text x="657" y="179" class="sub">Franchise + source-market mapping</text>
<text x="657" y="200" class="sub">Lifecycle metadata + human review</text>

<rect x="630" y="272" width="278" height="132" rx="18" class="card2"/>
<text x="657" y="310" class="title">Metrics + health signals</text>
<text x="657" y="339" class="sub">Activity, trend, churn, penetration</text>
<text x="657" y="360" class="sub">One canonical analytical layer</text>

<rect x="630" y="432" width="278" height="94" rx="18" fill="#0a2830" stroke="#356c68" stroke-width="1.4"/>
<text x="657" y="470" fill="#61e3c8" font="700 16px Inter,Segoe UI,sans-serif">Recovery score</text>
<text x="657" y="497" class="sub">Normalized, explainable signals</text>

<!-- decision + action -->
<rect x="982" y="112" width="342" height="114" rx="18" class="card"/>
<text x="1010" y="150" class="title">Eligibility + ranking</text>
<text x="1010" y="178" class="sub">Data quality • project state • cooldown</text>
<text x="1010" y="199" class="sub">Recommended focus + next-market rank</text>

<rect x="982" y="260" width="342" height="94" rx="18" class="card2"/>
<text x="1010" y="299" class="title">Market Investigation</text>
<text x="1010" y="326" class="sub">Evidence, context, and explanation</text>

<rect x="982" y="388" width="342" height="94" rx="18" class="card2"/>
<text x="1010" y="427" class="title">Recovery Project</text>
<text x="1010" y="454" class="sub">Strategy, monitoring, frozen snapshots</text>

<rect x="982" y="516" width="342" height="72" rx="17" fill="url(#accent)"/>
<text x="1010" y="560" fill="#07121f" font="800 16px Inter,Segoe UI,sans-serif">Measured outcome</text>

<!-- flows -->
<path d="M273 159 H335" class="flow"/>
<path d="M273 271 H335" class="flow"/>
<path d="M273 383 H335" class="flow"/>
<path d="M580 271 H605 V178 H630" class="flow"/>
<path d="M769 244 V272" class="flow"/>
<path d="M769 404 V432" class="flow"/>
<path d="M908 479 H945 V169 H982" class="flow"/>
<path d="M1153 226 V260" class="flow"/>
<path d="M1153 354 V388" class="flow"/>
<path d="M1153 482 V516" class="flow"/>

<text x="68" y="620" class="note">Raw evidence, identity, scoring, eligibility, and outcome measurement remain separate by design.</text>
</svg>
